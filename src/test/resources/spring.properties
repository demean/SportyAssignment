# Spring TestContext framework settings (read through SpringProperties).
#
# Never pause cached test contexts. The default (ON_CONTEXT_SWITCH) stops a cached context's SmartLifecycle beans
# whenever a test class switches to another context and restarts them when the context is reused. For this suite that
# means: the shared Embedded-Kafka context's listener containers leave and re-join the consumer group on every switch
# (a cooperative rebalance each time), and on a restart KafkaListenerEndpointRegistry starts every container even when
# spring.kafka.listener.auto-startup is false (alwaysStartAfterRefresh), so a context meant to run without consumers
# would join the embedded broker's consumer group and consume other tests' records against its own database.
spring.test.context.cache.pause=never
