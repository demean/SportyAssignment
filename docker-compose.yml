# All-in-one local environment: `docker compose up --build`
# (on machines without buildx/BuildKit: `DOCKER_BUILDKIT=0 COMPOSE_DOCKER_CLI_BUILD=0 docker compose up --build`).
#   API            http://localhost:8080/api/v1/jackpots   (Swagger UI: http://localhost:8080/swagger-ui.html)
#   Management     http://localhost:8081/actuator/health
#   Kafka UI       http://localhost:8090
#   Kafka (host)   localhost:9092     PostgreSQL (host) localhost:${POSTGRES_HOST_PORT:-5432} (jackpot/jackpot)
name: jackpot

services:
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:17-alpine
    command: postgres -c max_connections=200
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: jackpot
      POSTGRES_USER: jackpot
      POSTGRES_PASSWORD: jackpot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jackpot -d jackpot"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: jackpot
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  jackpot-service:
    build: .
    image: jackpot-service:1.0.0
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      POSTGRES_URL: jdbc:postgresql://postgres:5432/jackpot
      POSTGRES_USER: jackpot
      POSTGRES_PASSWORD: jackpot
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
