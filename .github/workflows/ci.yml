name: CI

# Manually triggered (Actions tab -> CI -> Run workflow). To run it on every push, add:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, tests, 100% coverage gate, Testcontainers IT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: ./mvnw verify -Pit (unit + integration tests, JaCoCo 100% gate, PostgreSQL + Kafka via Testcontainers)
        run: ./mvnw -B -ntp verify -Pit
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

  compose-e2e:
    name: Docker Compose end-to-end (scripts/demo.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start the full stack (Kafka, PostgreSQL, Kafka UI, service)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Run the API walkthrough
        run: bash scripts/demo.sh
      - name: Service logs
        if: always()
        run: docker compose logs --no-color jackpot-service | tail -n 300
      - name: Tear down
        if: always()
        run: docker compose down --volumes
